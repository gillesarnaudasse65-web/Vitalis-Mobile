<!doctype html>
<html><body><script>
  (function(){
    if(typeof VitalisNativeChannel!=="object"){
      parent.postMessage({type:"run6-subframe-reply",reply:"missing"},"*");
      return;
    }
    VitalisNativeChannel.onmessage=function(event){
      parent.postMessage({type:"run6-subframe-reply",reply:event.data},"*");
    };
    VitalisNativeChannel.postMessage(JSON.stringify({
      id:"run6-subframe",method:"refreshHealthData",args:[]
    }));
  })();
</script></body></html>
