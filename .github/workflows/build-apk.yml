name: Vitalis Android quality gates

on:
  workflow_dispatch:
    inputs:
      build_production:
        description: Build with the protected Vitalis production signing identity
        required: true
        default: false
        type: boolean
      build_upgrade_baseline:
        description: Also build the controlled versionCode 20 upgrade-test baseline with the same production certificate
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - agent/vitalis-run1-build-test-security-foundation
      - agent/vitalis-run3-health-connect-reliability
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Go 1.25 for signing recovery helper validation
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: scripts/vitalis-age/go.mod
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Show build environment
        run: ./gradlew --version
      - name: Verify Gradle tasks and plugin initialization
        run: ./gradlew --no-daemon tasks
      - name: JavaScript source contract tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=vitalis-js.xml scripts/test-*.cjs
      - name: Compile standard age signing recovery helper
        working-directory: scripts/vitalis-age
        run: go test ./...
      - name: Clean
        run: ./gradlew --no-daemon clean
      - name: Health Connect JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.HealthConnectReliabilityTest
      - name: Nutrition reliability JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.NutritionReliabilityTest
      - name: Voice reliability JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.VoiceReliabilityTest
      - name: Connector truthfulness JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.ConnectorCatalogTest
      - name: Run 6 security and privacy JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.Run6SecurityPrivacyTest
      - name: Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --rerun-tasks
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK and instrumentation package
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Upload unit and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-unit-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            vitalis-js.xml
          if-no-files-found: warn
          retention-days: 90
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Minified QA APK and AAB (test signed)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble test-signed QA APK and AAB
        env:
          VITALIS_USE_DEBUG_RELEASE_SIGNING: 'true'
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Generate release SHA-256 checksums
        run: |
          mkdir -p app/build/distributions
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.apk
          cp app/build/outputs/bundle/release/app-release.aab \
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.aab
          sha256sum \
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.apk \
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.aab \
            app/build/outputs/mapping/release/mapping.txt \
            > app/build/distributions/vitalis-sha256.txt
      - name: Verify and record release signatures
        run: |
          set -euo pipefail
          mkdir -p app/build/distributions
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER_PATH"
          {
            echo "Vitalis 3.15.0-rc1"
            echo "Signing label: test-signed"
            echo "Distribution status: NOT FOR PRODUCTION DISTRIBUTION"
            echo
            echo "APK signer verification"
            "$APKSIGNER_PATH" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
            echo
            echo "AAB JAR signature verification"
            jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          } > app/build/distributions/vitalis-signature-report.txt
          stat --printf='%n %s bytes\n' \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt \
            > app/build/distributions/vitalis-artifact-sizes.txt
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-3.15.0-rc1-physical-hotfix-qa
          path: |
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.apk
            app/build/distributions/Vitalis-3.15.0-rc1-physical-hotfix-qa.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/distributions/vitalis-sha256.txt
            app/build/distributions/vitalis-signature-report.txt
            app/build/distributions/vitalis-artifact-sizes.txt
            docs/RELEASE_NOTES_3_15_0_RC1.md
          if-no-files-found: error
          retention-days: 90

  production_release:
    name: Production-signed RC APK and AAB
    if: github.event_name == 'workflow_dispatch' && inputs.build_production == true
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      VITALIS_VAULT_REPOSITORY: gillesarnaudasse65-web/Vitalis-Signing-Vault
      VITALIS_VAULT_RECOVERY_PATH: Vitalis-Production-Signing-Recovery.tar.gz.age
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: scripts/vitalis-age/go.mod
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Restore active production signing identity from private encrypted vault
        env:
          VITALIS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.VITALIS_SIGNING_BACKUP_PASSPHRASE }}
          VITALIS_SIGNING_VAULT_TOKEN: ${{ secrets.VITALIS_SIGNING_VAULT_TOKEN }}
        run: scripts/restore-vitalis-signing.sh "$RUNNER_TEMP/vitalis-signing"
      - name: Assemble production-signed RC APK and AAB
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(jq -er '.keystore_password' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          ALIAS=$(jq -er '.alias' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          KEY_PASSWORD=$(jq -er '.key_password' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          VITALIS_KEYSTORE_PATH="$RUNNER_TEMP/vitalis-signing/vitalis-production.jks" \
          VITALIS_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          VITALIS_KEY_ALIAS="$ALIAS" \
          VITALIS_KEY_PASSWORD="$KEY_PASSWORD" \
            ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify production signatures and checksums
        run: |
          set -euo pipefail
          mkdir -p app/build/distributions
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER_PATH"
          "$APKSIGNER_PATH" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk \
            > app/build/distributions/vitalis-production-signature.txt
          ! grep -Fq 'CN=Android Debug' app/build/distributions/vitalis-production-signature.txt
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab \
            >> app/build/distributions/vitalis-production-signature.txt

          EXPECTED_SHA256=$(awk -F'|' '$2 ~ /Certificate SHA-256/ {gsub(/[ `]/, "", $3); print $3}' \
            docs/VITALIS_SIGNING_IDENTITY.md | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(grep -F 'Signer #1 certificate SHA-256 digest:' \
            app/build/distributions/vitalis-production-signature.txt | head -n 1 | awk '{print $NF}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$APK_SHA256" = "$EXPECTED_SHA256"

          unzip -p app/build/outputs/bundle/release/app-release.aab 'META-INF/*.RSA' \
            > "$RUNNER_TEMP/vitalis-aab-signature.p7b"
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/vitalis-aab-signature.p7b" \
            -print_certs -out "$RUNNER_TEMP/vitalis-aab-cert.pem"
          AAB_SHA256=$(openssl x509 -in "$RUNNER_TEMP/vitalis-aab-cert.pem" \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$AAB_SHA256" = "$EXPECTED_SHA256"

          cp app/build/outputs/apk/release/app-release.apk \
            app/build/distributions/Vitalis-3.15.0-rc1-production.apk
          cp app/build/outputs/bundle/release/app-release.aab \
            app/build/distributions/Vitalis-3.15.0-rc1-production.aab
          sha256sum \
            app/build/distributions/Vitalis-3.15.0-rc1-production.apk \
            app/build/distributions/Vitalis-3.15.0-rc1-production.aab \
            app/build/outputs/mapping/release/mapping.txt \
            > app/build/distributions/vitalis-production-sha256.txt
          stat --printf='%n %s bytes\n' \
            app/build/distributions/Vitalis-3.15.0-rc1-production.apk \
            app/build/distributions/Vitalis-3.15.0-rc1-production.aab \
            app/build/outputs/mapping/release/mapping.txt \
            > app/build/distributions/vitalis-production-sizes.txt
      - name: Remove temporary production keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/vitalis-signing"
      - name: Upload production candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-3.15.0-rc1-production-signed
          path: |
            app/build/distributions/Vitalis-3.15.0-rc1-production.apk
            app/build/distributions/Vitalis-3.15.0-rc1-production.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/distributions/vitalis-production-signature.txt
            app/build/distributions/vitalis-production-sha256.txt
            app/build/distributions/vitalis-production-sizes.txt
            docs/RELEASE_NOTES_3_15_0_RC1.md
          if-no-files-found: error
          retention-days: 90

  production_upgrade_baseline:
    name: Production-signed versionCode 20 upgrade baseline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_production == true &&
      inputs.build_upgrade_baseline == true
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      VITALIS_VAULT_REPOSITORY: gillesarnaudasse65-web/Vitalis-Signing-Vault
      VITALIS_VAULT_RECOVERY_PATH: Vitalis-Production-Signing-Recovery.tar.gz.age
    steps:
      - name: Check out RC signing infrastructure
        uses: actions/checkout@v4
      - name: Check out verified versionCode 20 source
        uses: actions/checkout@v4
        with:
          ref: 188a31e2ff34ef102cdcfa861f8de69972bee88e
          path: baseline-source
      - name: Verify controlled baseline identity
        run: |
          grep -Fq 'applicationId = "com.vitalis.healthos"' baseline-source/app/build.gradle.kts
          grep -Fq 'versionCode = 20' baseline-source/app/build.gradle.kts
          grep -Fq 'versionName = "3.15.0-security-release"' baseline-source/app/build.gradle.kts
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: scripts/vitalis-age/go.mod
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Restore active production signing identity from private encrypted vault
        env:
          VITALIS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.VITALIS_SIGNING_BACKUP_PASSPHRASE }}
          VITALIS_SIGNING_VAULT_TOKEN: ${{ secrets.VITALIS_SIGNING_VAULT_TOKEN }}
        run: scripts/restore-vitalis-signing.sh "$RUNNER_TEMP/vitalis-signing"
      - name: Build controlled production-signed versionCode 20 baseline
        working-directory: baseline-source
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(jq -er '.keystore_password' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          ALIAS=$(jq -er '.alias' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          KEY_PASSWORD=$(jq -er '.key_password' "$RUNNER_TEMP/vitalis-signing/signing-secrets.json")
          VITALIS_KEYSTORE_PATH="$RUNNER_TEMP/vitalis-signing/vitalis-production.jks" \
          VITALIS_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
          VITALIS_KEY_ALIAS="$ALIAS" \
          VITALIS_KEY_PASSWORD="$KEY_PASSWORD" \
            ./gradlew --no-daemon assembleRelease
      - name: Verify and package versionCode 20 baseline
        run: |
          set -euo pipefail
          mkdir -p baseline-source/app/build/distributions
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$APKSIGNER_PATH" verify --verbose --print-certs \
            baseline-source/app/build/outputs/apk/release/app-release.apk \
            > baseline-source/app/build/distributions/vitalis-v20-signature.txt
          ! grep -Fq 'CN=Android Debug' baseline-source/app/build/distributions/vitalis-v20-signature.txt
          EXPECTED_SHA256=$(awk -F'|' '$2 ~ /Certificate SHA-256/ {gsub(/[ `]/, "", $3); print $3}' \
            docs/VITALIS_SIGNING_IDENTITY.md | tr -d ':' | tr '[:upper:]' '[:lower:]')
          BASELINE_SHA256=$(grep -F 'Signer #1 certificate SHA-256 digest:' \
            baseline-source/app/build/distributions/vitalis-v20-signature.txt | awk '{print $NF}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$BASELINE_SHA256" = "$EXPECTED_SHA256"
          cp baseline-source/app/build/outputs/apk/release/app-release.apk \
            baseline-source/app/build/distributions/Vitalis-upgrade-test-baseline-v20-production.apk
          sha256sum baseline-source/app/build/distributions/Vitalis-upgrade-test-baseline-v20-production.apk \
            > baseline-source/app/build/distributions/vitalis-v20-sha256.txt
          {
            echo "UPGRADE TEST BASELINE NOT CURRENT DISTRIBUTION BUILD"
            echo "Application ID: com.vitalis.healthos"
            echo "Version code: 20"
            echo "Source: 188a31e2ff34ef102cdcfa861f8de69972bee88e"
            echo "Purpose: phone-only same-certificate upgrade validation to versionCode 21"
          } > baseline-source/app/build/distributions/BASELINE-WARNING.txt
      - name: Remove temporary production keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/vitalis-signing"
      - name: Upload controlled upgrade baseline
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-upgrade-test-baseline-v20-production-signed
          path: |
            baseline-source/app/build/distributions/Vitalis-upgrade-test-baseline-v20-production.apk
            baseline-source/app/build/distributions/vitalis-v20-signature.txt
            baseline-source/app/build/distributions/vitalis-v20-sha256.txt
            baseline-source/app/build/distributions/BASELINE-WARNING.txt
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Emulator smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
            git fetch --depth=1 origin dd78d30244bdedb62346ab6f02f3063a590c989c
            git worktree add "$RUNNER_TEMP/vitalis-run5-baseline" dd78d30244bdedb62346ab6f02f3063a590c989c
            cp app/src/androidTest/java/com/vitalis/healthos/Run6UpgradeContinuityTest.kt "$RUNNER_TEMP/vitalis-run5-baseline/app/src/androidTest/java/com/vitalis/healthos/"
            (cd "$RUNNER_TEMP/vitalis-run5-baseline" && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest)
            adb install "$RUNNER_TEMP/vitalis-run5-baseline/app/build/outputs/apk/debug/app-debug.apk"
            adb install "$RUNNER_TEMP/vitalis-run5-baseline/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb shell am instrument -w -e class 'com.vitalis.healthos.Run6UpgradeContinuityTest#a_seedPreRun6Data' com.vitalis.healthos.test/androidx.test.runner.AndroidJUnitRunner > upgrade-seed.txt
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class 'com.vitalis.healthos.Run6UpgradeContinuityTest#b_verifyRun6UpgradePreservesData' com.vitalis.healthos.test/androidx.test.runner.AndroidJUnitRunner > upgrade-verify.txt
            cat upgrade-seed.txt upgrade-verify.txt > upgrade-continuity.txt
            grep -q 'OK (1 test)' upgrade-seed.txt
            grep -q 'OK (1 test)' upgrade-verify.txt
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p ux-screenshots
            adb pull /sdcard/Pictures/VitalisFinalUX/. ux-screenshots/
            adb pull /sdcard/Download/VitalisFinalUX/performance.json ux-screenshots/
            VITALIS_USE_DEBUG_RELEASE_SIGNING=true ./gradlew --no-daemon assembleRelease
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.vitalis.healthos/.MainActivity > release-smoke.txt
            adb shell pidof com.vitalis.healthos >> release-smoke.txt
            adb shell dumpsys package com.vitalis.healthos | sed -n '/versionCode=/p;/versionName=/p' >> release-smoke.txt
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            release-smoke.txt
            upgrade-continuity.txt
            upgrade-seed.txt
            upgrade-verify.txt
            ux-screenshots/
          if-no-files-found: warn
          retention-days: 90
