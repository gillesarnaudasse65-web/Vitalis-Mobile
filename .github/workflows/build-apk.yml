name: Vitalis Android quality gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent/vitalis-run1-build-test-security-foundation
      - agent/vitalis-run3-health-connect-reliability
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Show build environment
        run: ./gradlew --version
      - name: Verify Gradle tasks and plugin initialization
        run: ./gradlew --no-daemon tasks
      - name: JavaScript source contract tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=vitalis-js.xml scripts/test-*.cjs
      - name: Clean
        run: ./gradlew --no-daemon clean
      - name: Health Connect JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.HealthConnectReliabilityTest
      - name: Nutrition reliability JVM tests (isolated)
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.vitalis.healthos.NutritionReliabilityTest
      - name: Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --rerun-tasks
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK and instrumentation package
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Upload unit and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-unit-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            vitalis-js.xml
          if-no-files-found: warn
          retention-days: 90
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 90

  emulator:
    name: Emulator smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitalis-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 90
